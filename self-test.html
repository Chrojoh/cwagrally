<!doctype html>
<meta charset="utf-8">
<title>Rally Course Designer V3 multi-organization self-test</title>
<style>body{font:14px/1.45 system-ui;margin:24px} .pass{color:#176b35}.fail{color:#a22424}</style>
<h1>Rally Course Designer V3 self-test</h1>
<pre id="out">Running…</pre>
<script type="module">
import { rulePacks, organizations } from './src/orgs/registry.js';
import { generateCourse } from './src/core/generator.js';
import { rerouteAroundNoGoZones, routeNoGoConflicts } from './src/core/venue.js';
import { validateCourse } from './src/core/validator.js';
import { upgradeCourse } from './src/core/upgrade.js';
import { officialStationCount, ringRuleIssues } from './src/core/pack.js';
import { maxUsesFor } from './src/core/rules.js';
import { requiredTurnAt } from './src/core/geometry.js';

const out=document.getElementById('out');
const lines=[];
function test(name,fn){
  try{fn();lines.push('PASS  '+name)}catch(e){lines.push('FAIL  '+name+' — '+e.message)}
}
function legal(c,p){return !validateCourse(c,p).some(r=>!r.ok&&r.severity==='error')}
function generate(pack,levelId){
  const level=pack.levels[levelId];
  return generateCourse({pack,levelId,ring:{...level.defaultRing,minSpacing:4.5},includeSequences:true,routeStyle:'mixed'});
}

test('Three organization packs are installed',()=>{
  for(const id of ['cwags:2021','caro:2025.12','ckc:2025']) if(!rulePacks[id]) throw Error(`missing ${id}`);
  if(organizations.length<3) throw Error('organization selector list incomplete');
});

test('C-WAGS Starter generates and validates',()=>{
  const p=rulePacks['cwags:2021'],c=generate(p,'S'); if(!legal(c,p)) throw Error('invalid Starter course');
});

test('CARO Novice counts Start/Finish and generates',()=>{
  const p=rulePacks['caro:2025.12'],c=generate(p,'N');
  if(!legal(c,p)) throw Error('invalid CARO Novice course');
  const n=officialStationCount(c,p.levels.N); if(n<15||n>20) throw Error(`official count ${n}`);
});


test('CARO ring rule is minimum area, not a fixed 50x40 shape',()=>{
  const p=rulePacks['caro:2025.12'];
  for(const level of Object.values(p.levels)){
    if(ringRuleIssues(level,{width:50,height:30}).length) throw Error(`${level.id}: 50x30 should meet the 1,500 sq ft minimum`);
    if(ringRuleIssues(level,{width:40,height:37.5}).length) throw Error(`${level.id}: 40x37.5 should meet the 1,500 sq ft minimum`);
    if(!ringRuleIssues(level,{width:40,height:37}).length) throw Error(`${level.id}: 40x37 should be below the minimum`);
  }
  if(p.levels.N.defaultRing.width!==50||p.levels.N.defaultRing.height!==40) throw Error('CARO program default should remain 50x40');
});

test('CARO Novice can progress directly to Advanced',()=>{
  const p=rulePacks['caro:2025.12'],c=generate(p,'N');
  const next=upgradeCourse(c,p,'A').course; if(!legal(next,p)) throw Error('invalid CARO Advanced upgrade');
});

test('CARO Versatility stays manual until side-state solver is enabled',()=>{
  const p=rulePacks['caro:2025.12']; if(p.levels.V.generationEnabled!==false||p.levels.VX.generationEnabled!==false) throw Error('V/VX unexpectedly auto-enabled');
});

test('CKC Novice counts exercises excluding Start/Finish',()=>{
  const p=rulePacks['ckc:2025'],c=generate(p,'N');
  if(!legal(c,p)) throw Error('invalid CKC Novice course');
  const n=officialStationCount(c,p.levels.N); if(n<10||n>15) throw Error(`official count ${n}`);
});

test('CKC Excellent adds non-counted Sit Stay auxiliary',()=>{
  const p=rulePacks['ckc:2025'],c=generate(p,'X');
  if(!legal(c,p)) throw Error('invalid CKC Excellent course');
  const stay=(c.auxiliary||[]).find(a=>a.signId==='298');
  if(!stay||stay.counted!==false) throw Error('Sit Stay auxiliary missing/not non-counted');
});

test('CKC Master sign 103 may be used twice',()=>{
  const p=rulePacks['ckc:2025'];
  if(maxUsesFor(p,'M','103')!==2) throw Error(`sign 103 max uses is ${maxUsesFor(p,'M','103')}, expected 2`);
  for(const id of ['5','6','9','10']){
    if(maxUsesFor(p,'M',id)!==1) throw Error(`Master sign ${id} should be limited to one use`);
  }
});

test('CKC Intermediate excludes sign 103',()=>{
  const p=rulePacks['ckc:2025'];
  if(p.levels.I.allowedSigns.includes('103')) throw Error('sign 103 must not be available in Intermediate');
});

test('CKC Advanced allows exactly one jump',()=>{
  const p=rulePacks['ckc:2025'];
  const q=p.levels.A.quotas.find(q=>q.id==='jumps');
  if(!q||q.min!==1||q.max!==1||!q.signIds.includes('103')) throw Error('Advanced jump quota is incorrect');
});

test('CKC Excellent and Master require exactly two nonconsecutive jumps',()=>{
  const p=rulePacks['ckc:2025'];
  for(const levelId of ['X','M']){
    const q=p.levels[levelId].quotas.find(q=>q.id==='jumps');
    if(!q||q.min!==2||q.max!==2) throw Error(`${levelId} jump quota is not exactly two`);
    const nc=p.levels[levelId].nonConsecutiveSets?.find(r=>r.id==='jump-spacing');
    if(!nc||nc.minStationSeparation<2) throw Error(`${levelId} nonconsecutive jump rule missing`);
  }
});


test('CKC Excellent Sit Stay follows Finish with a 15 ft leash lane',()=>{
  const p=rulePacks['ckc:2025'],c=generate(p,'X');
  const aux=(c.auxiliary||[]).find(a=>a.signId==='298');
  const finish=c.nodes.find(n=>n.kind==='finish');
  if(!aux||!finish) throw Error('Sit Stay or Finish missing');
  const finishGap=Math.hypot(aux.x-finish.x,aux.y-finish.y);
  const leashGap=Math.hypot(aux.leashX-aux.x,aux.leashY-aux.y);
  if(!aux.afterFinish||finishGap<3||finishGap>10) throw Error(`Sit Stay is not in the post-Finish flow (${finishGap.toFixed(1)} ft)`);
  if(leashGap<14.95) throw Error(`leash lane only ${leashGap.toFixed(1)} ft`);
});

test('CKC Master Stand Stay follows Finish with a 15 ft leash lane',()=>{
  const p=rulePacks['ckc:2025'],c=generate(p,'M');
  const aux=(c.auxiliary||[]).find(a=>a.signId==='398');
  const finish=c.nodes.find(n=>n.kind==='finish');
  if(!aux||!finish) throw Error('Stand Stay or Finish missing');
  const finishGap=Math.hypot(aux.x-finish.x,aux.y-finish.y);
  const leashGap=Math.hypot(aux.leashX-aux.x,aux.leashY-aux.y);
  if(!aux.afterFinish||finishGap<3||finishGap>10) throw Error(`Stand Stay is not in the post-Finish flow (${finishGap.toFixed(1)} ft)`);
  if(leashGap<14.95) throw Error(`leash lane only ${leashGap.toFixed(1)} ft`);
});



test('CARO compact legal ring shapes generate reliably',()=>{
  const p=rulePacks['caro:2025.12'];
  for(const ring of [{width:50,height:30},{width:40,height:37.5},{width:60,height:25}]){
    for(const levelId of ['N','I','A','X']){
      const c=generateCourse({
        pack:p,levelId,
        ring:{...ring,minSpacing:4.5},
        includeSequences:true,routeStyle:'mixed',noGoZones:[]
      });
      if(!legal(c,p)) throw Error(`${levelId}: ${ring.width}x${ring.height} compact CARO course invalid`);
    }
  }
});

test('Venue detour waypoints do not manufacture rally-sign turns',()=>{
  const nodes=[
    {kind:'start',x:2,y:10},
    {kind:'station',x:12,y:10},
    {kind:'waypoint',x:16,y:14,venueDetour:true},
    {kind:'station',x:24,y:10},
    {kind:'finish',x:34,y:10}
  ];
  const turn=requiredTurnAt(nodes,1);
  if(Math.abs(turn)>0.01) throw Error(`detour changed station turn requirement to ${turn.toFixed(1)}°`);
});

test('CARO compact Advanced can route around a central pillar',()=>{
  const p=rulePacks['caro:2025.12'];
  const zone={id:'pillar',label:'Pillar',x:23,y:13,width:4,height:4};
  const c=generateCourse({
    pack:p,levelId:'A',ring:{width:50,height:30,minSpacing:4.5},
    includeSequences:false,routeStyle:'classic',noGoZones:[zone]
  });
  if(!legal(c,p)) throw Error('50x30 Advanced course with central pillar is invalid');
  if(routeNoGoConflicts(c.nodes,c.noGoZones,.5).length) throw Error('Advanced route crosses pillar');
});

test('CARO compact progression keeps a future equipment bay with a no-go zone',()=>{
  const p=rulePacks['caro:2025.12'];
  const zone={id:'pillar',label:'Pillar',x:23,y:13,width:4,height:4};
  let c=generateCourse({
    pack:p,levelId:'N',ring:{width:50,height:30,minSpacing:4.5},
    includeSequences:false,routeStyle:'classic',noGoZones:[zone]
  });
  for(const target of ['I','A','X']){
    c=upgradeCourse(c,p,target).course;
    if(!legal(c,p)) throw Error(`invalid CARO ${target} venue-aware upgrade`);
  }
});

test('CARO near-square compact ring can place equipment to one side of a central obstacle',()=>{
  const p=rulePacks['caro:2025.12'];
  const zone={id:'pillar',label:'Pillar',x:18,y:16,width:4,height:4};
  const c=generateCourse({
    pack:p,levelId:'A',ring:{width:40,height:37.5,minSpacing:4.5},
    includeSequences:false,routeStyle:'classic',noGoZones:[zone]
  });
  if(!legal(c,p)) throw Error('40x37.5 Advanced course with central pillar is invalid');
});

test('Venue router adds non-counted waypoints around an obstacle',()=>{
  const points=[
    {x:5,y:20,routeRole:'start'},
    {x:45,y:20,routeRole:'finish'}
  ];
  const zones=[{id:'box',label:'Pillar',x:23,y:18,width:4,height:4}];
  const routed=rerouteAroundNoGoZones(points,zones,{width:50,height:40},{buffer:.5,margin:1.5});
  if(!routed) throw Error('router returned no path');
  if(!routed.some(p=>p.routeRole==='waypoint')) throw Error('router did not add a detour waypoint');
  const nodes=routed.map((p,i)=>({kind:p.routeRole||'waypoint',stationId:`r${i}`,x:p.x,y:p.y}));
  if(routeNoGoConflicts(nodes,zones,.5).length) throw Error('detoured route still crosses obstacle');
});

test('Venue no-go zones are preserved and generated routes avoid them',()=>{
  const p=rulePacks['caro:2025.12'];
  const zone={id:'test-zone',label:'Pillar area',x:21,y:16,width:5,height:5};
  const c=generateCourse({
    pack:p,levelId:'N',
    ring:{...p.levels.N.defaultRing,minSpacing:4.5},
    includeSequences:false,routeStyle:'mixed',
    noGoZones:[zone]
  });
  if((c.noGoZones||[]).length!==1) throw Error('venue zone not persisted');
  if(routeNoGoConflicts(c.nodes,c.noGoZones,.5).length) throw Error('generated route intersects no-go zone');
  if(!legal(c,p)) throw Error('venue-aware CARO course is invalid');
});

test('Level-change report includes station ordinals for physical setup',()=>{
  const p=rulePacks['ckc:2025'];
  const c=generate(p,'N');
  const out=upgradeCourse(c,p,'I');
  const actionable=out.report.changes.filter(x=>x.type!=='kept');
  for(const x of actionable){
    if(x.type==='removed' && !Number.isFinite(x.beforeOrdinal)) throw Error('removed station lacks old ordinal');
    if(x.type!=='removed' && !Number.isFinite(x.afterOrdinal)) throw Error(`${x.type} station lacks new ordinal`);
  }
});

test('CKC full progression preserves two nonconsecutive jump bays',()=>{
  const p=rulePacks['ckc:2025'];
  let c=generate(p,'N');
  for(const target of ['I','A','X','M']){
    c=upgradeCourse(c,p,target).course;
    if(!legal(c,p)) throw Error(`invalid CKC ${target} upgrade`);
  }
  const jumpSet=new Set(['103','216','217','312','324','325','334']);
  const stations=c.nodes.filter(n=>n.kind==='station');
  const jumps=stations.map((n,i)=>jumpSet.has(n.signId)?i:-1).filter(i=>i>=0);
  if(jumps.length!==2) throw Error(`Master jump count ${jumps.length}`);
  if(Math.abs(jumps[0]-jumps[1])<2) throw Error('Master jumps are consecutive');
  const stay=(c.auxiliary||[]).find(a=>a.signId==='398');
  if(!stay||stay.counted!==false) throw Error('Stand Stay auxiliary missing/not non-counted');
});

out.textContent=lines.join('\n');
out.className=lines.some(x=>x.startsWith('FAIL'))?'fail':'pass';
</script>
